<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!--
  1200x630 Open Graph template for NewTube.
  Render to assets/og-image.png at exactly 1200x630, e.g.:
    npx playwright screenshot --viewport-size=1200,630 assets/og-template.html assets/og-image.png
  (or any headless-Chrome shot of the .og element). Matches assets/og-image.svg.
-->
<style>
  :root { --accent: #FF2E3F; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #0B0B0D; }
  .og {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    background:
      radial-gradient(70% 70% at 82% 8%, rgba(255,46,63,.42), transparent 55%),
      radial-gradient(60% 60% at 6% 100%, rgba(255,46,63,.18), transparent 60%),
      linear-gradient(135deg, #0B0B0D, #100b0d);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #F5F5F7; box-shadow: inset 0 0 0 1px #2a2a31;
  }
  .brand { position: absolute; top: 80px; left: 84px; display: flex; align-items: center; gap: 16px; }
  .brand .glyph { width: 46px; height: 37px; border-radius: 11px; background: linear-gradient(180deg,#FF5A66,#FF2E3F); position: relative; }
  .brand .glyph::after { content: ""; position: absolute; left: 18px; top: 10px; border-left: 15px solid #0B0B0D; border-top: 9px solid transparent; border-bottom: 9px solid transparent; }
  .brand .word { font-size: 38px; font-weight: 800; letter-spacing: -1px; }
  .brand .word b { color: var(--accent); font-weight: 800; }

  .head { position: absolute; left: 82px; top: 196px; }
  .head h1 { font-size: 76px; font-weight: 900; letter-spacing: -3px; line-height: 1.06; }
  .head h1 .a { color: var(--accent); }
  .head p { margin-top: 22px; font-size: 30px; font-weight: 500; color: #A0A0A8; }

  .chips { position: absolute; left: 84px; top: 470px; display: flex; gap: 16px; }
  .chip { height: 46px; padding: 0 22px; border-radius: 23px; display: flex; align-items: center; font-size: 22px; font-weight: 700; color: #A0A0A8; background: #17171A; border: 1px solid #2a2a31; }
  .chip.accent { color: #12060a; background: linear-gradient(180deg,#FF5A66,#FF2E3F); border-color: transparent; }

  .phone { position: absolute; left: 866px; top: 140px; width: 250px; height: 412px; border-radius: 38px; background: #16161b; border: 2px solid #34343d; padding: 10px; }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 26px; overflow: hidden; background: linear-gradient(135deg,#1c1c22,#0d0d10); }
  .notch { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 70px; height: 14px; border-radius: 7px; background: #050506; z-index: 3; }
  .stop { display: flex; align-items: center; justify-content: space-between; padding: 24px 16px 0; }
  .stop .lg { font-size: 19px; font-weight: 900; }
  .stop .lg b { color: var(--accent); }
  .stop .search { width: 18px; height: 18px; border: 2px solid #A0A0A8; border-radius: 50%; position: relative; }
  .stop .search::after { content: ""; position: absolute; right: -5px; bottom: -5px; width: 8px; height: 2px; background: #A0A0A8; transform: rotate(45deg); }
  .g { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px 14px 0; }
  .g .c .t { height: 60px; border-radius: 7px; }
  .g .c .l1 { height: 8px; border-radius: 4px; background: #2a2a31; margin-top: 8px; }
  .g .c .l2 { height: 8px; width: 58%; border-radius: 4px; background: #2a2a31; margin-top: 6px; }
  .g .c:nth-child(1) .t { background: #3a2330; }
  .g .c:nth-child(2) .t { background: #1f2a3a; }
  .g .c:nth-child(3) .t { background: #26332a; }
  .g .c:nth-child(4) .t { background: #332c1f; }
  .g .c:nth-child(5) .t { background: #2f2438; }
  .g .c:nth-child(6) .t { background: #203233; }
  .bnav { position: absolute; left: 0; right: 0; bottom: 0; height: 42px; background: #17171A; display: flex; align-items: center; justify-content: space-around; }
  .bnav i { width: 8px; height: 8px; border-radius: 50%; background: #74747d; }
  .bnav i.on { background: var(--accent); }
</style>
</head>
<body>
  <div class="og">
    <div class="brand"><span class="glyph"></span><span class="word">New<b>Tube</b></span></div>

    <div class="head">
      <h1>SmartTube, but<br>for your <span class="a">Android phone.</span></h1>
      <p>Free, open-source, ad-free YouTube — no root, no tracking.</p>
    </div>

    <div class="chips">
      <span class="chip accent">Open source (MIT)</span>
      <span class="chip">No ads</span>
      <span class="chip">No root</span>
      <span class="chip">SponsorBlock</span>
    </div>

    <div class="phone">
      <div class="screen">
        <div class="notch"></div>
        <div class="stop"><span class="lg">New<b>Tube</b></span><span class="search"></span></div>
        <div class="g">
          <div class="c"><div class="t"></div><div class="l1"></div><div class="l2"></div></div>
          <div class="c"><div class="t"></div><div class="l1"></div><div class="l2"></div></div>
          <div class="c"><div class="t"></div><div class="l1"></div><div class="l2"></div></div>
          <div class="c"><div class="t"></div><div class="l1"></div><div class="l2"></div></div>
          <div class="c"><div class="t"></div><div class="l1"></div><div class="l2"></div></div>
          <div class="c"><div class="t"></div><div class="l1"></div><div class="l2"></div></div>
        </div>
        <div class="bnav"><i class="on"></i><i></i><i></i><i></i><i></i></div>
      </div>
    </div>
  </div>
</body>
</html>
