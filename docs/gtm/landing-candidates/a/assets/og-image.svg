<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="NewTube — SmartTube, but for your Android phone. Ad-free, open source, no root.">
  <defs>
    <radialGradient id="glow" cx="78%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#FF453A" stop-opacity="0.34"/>
      <stop offset="42%" stop-color="#FF453A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FF453A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#202024"/>
      <stop offset="100%" stop-color="#101013"/>
    </linearGradient>
    <linearGradient id="th1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2140"/><stop offset="1" stop-color="#3a2a58"/></linearGradient>
    <linearGradient id="th2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#123033"/><stop offset="1" stop-color="#17484a"/></linearGradient>
    <linearGradient id="th3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a1f22"/><stop offset="1" stop-color="#5a2a2f"/></linearGradient>
    <linearGradient id="th4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e2a3a"/><stop offset="1" stop-color="#26405c"/></linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0B0B0D"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Left: brand + copy -->
  <g transform="translate(80, 132)">
    <!-- wordmark -->
    <g>
      <rect x="0" y="2" width="52" height="38" rx="11" fill="none" stroke="#F4F4F6" stroke-width="3.4"/>
      <path d="M19 12 L35 21 L19 30 Z" fill="#FF453A"/>
      <text x="70" y="34" font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" letter-spacing="-1.4">
        <tspan fill="#F4F4F6">New</tspan><tspan fill="#FF453A">Tube</tspan>
      </text>
    </g>

    <!-- eyebrow -->
    <g transform="translate(2, 96)">
      <rect x="0" y="-11" width="26" height="2" fill="#FF453A"/>
      <text x="40" y="-4" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="19" letter-spacing="3" fill="#A0A0A8">AD-FREE YOUTUBE · OPEN SOURCE</text>
    </g>

    <!-- headline -->
    <text font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="250" letter-spacing="-3" fill="#F4F4F6">
      <tspan x="0" y="185" font-size="72">SmartTube, but for</tspan>
      <tspan x="0" y="262" font-size="72">your Android phone.</tspan>
    </text>

    <!-- subhead -->
    <text x="2" y="322" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="300" fill="#A0A0A8">
      Free, open-source, ad-free — no root, no tracking.
    </text>

    <!-- chips -->
    <g transform="translate(2, 360)" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" fill="#A0A0A8">
      <g>
        <rect x="0" y="0" width="150" height="38" rx="19" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
        <text x="20" y="25">Open source (MIT)</text>
      </g>
      <g transform="translate(166,0)">
        <rect x="0" y="0" width="98" height="38" rx="19" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
        <text x="20" y="25">No ads</text>
      </g>
      <g transform="translate(280,0)">
        <rect x="0" y="0" width="112" height="38" rx="19" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
        <text x="20" y="25">No root</text>
      </g>
    </g>
  </g>

  <!-- Right: stylized phone with home grid -->
  <g transform="translate(858, 118)">
    <rect x="0" y="0" width="252" height="410" rx="40" fill="url(#phone)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
    <rect x="10" y="10" width="232" height="390" rx="31" fill="#0E0E11"/>
    <!-- top bar -->
    <text x="26" y="46" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#F4F4F6">New<tspan fill="#FF453A">Tube</tspan></text>
    <circle cx="214" cy="41" r="8" fill="none" stroke="#A0A0A8" stroke-width="2"/>
    <line x1="220" y1="47" x2="226" y2="53" stroke="#A0A0A8" stroke-width="2" stroke-linecap="round"/>
    <!-- grid -->
    <g>
      <!-- row 1 -->
      <rect x="24" y="66" width="94" height="53" rx="7" fill="url(#th1)"/>
      <rect x="24" y="124" width="76" height="6" rx="3" fill="#ffffff" fill-opacity="0.16"/>
      <rect x="24" y="134" width="50" height="6" rx="3" fill="#ffffff" fill-opacity="0.10"/>
      <rect x="134" y="66" width="94" height="53" rx="7" fill="url(#th2)"/>
      <rect x="134" y="124" width="70" height="6" rx="3" fill="#ffffff" fill-opacity="0.16"/>
      <rect x="134" y="134" width="46" height="6" rx="3" fill="#ffffff" fill-opacity="0.10"/>
      <!-- row 2 -->
      <rect x="24" y="158" width="94" height="53" rx="7" fill="url(#th3)"/>
      <rect x="24" y="216" width="82" height="6" rx="3" fill="#ffffff" fill-opacity="0.16"/>
      <rect x="24" y="226" width="52" height="6" rx="3" fill="#ffffff" fill-opacity="0.10"/>
      <rect x="134" y="158" width="94" height="53" rx="7" fill="url(#th4)"/>
      <rect x="134" y="216" width="66" height="6" rx="3" fill="#ffffff" fill-opacity="0.16"/>
      <rect x="134" y="226" width="44" height="6" rx="3" fill="#ffffff" fill-opacity="0.10"/>
      <!-- row 3 -->
      <rect x="24" y="250" width="94" height="53" rx="7" fill="url(#th2)"/>
      <rect x="24" y="308" width="78" height="6" rx="3" fill="#ffffff" fill-opacity="0.16"/>
      <rect x="134" y="250" width="94" height="53" rx="7" fill="url(#th1)"/>
      <rect x="134" y="308" width="72" height="6" rx="3" fill="#ffffff" fill-opacity="0.16"/>
    </g>
    <!-- bottom nav -->
    <line x1="10" y1="356" x2="242" y2="356" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <g fill="#6E6E76">
      <path d="M40 372 L52 361 L64 372 L64 384 L40 384 Z" fill="#FF453A"/>
      <circle cx="98" cy="373" r="9" fill="none" stroke="#6E6E76" stroke-width="2"/>
      <circle cx="146" cy="373" r="9" fill="none" stroke="#6E6E76" stroke-width="2"/>
      <rect x="185" y="365" width="18" height="16" rx="2" fill="none" stroke="#6E6E76" stroke-width="2"/>
    </g>
  </g>
</svg>
