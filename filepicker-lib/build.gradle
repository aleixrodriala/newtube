apply from: gradle.ext.sharedModulesConstants
apply plugin: 'com.android.library'

task sourceJar(type: Jar) {
    from android.sourceSets.main.java.srcDirs
    archiveClassifier = 'sources' // Gradle 8: 'classifier' is gone
}

android {
    namespace = 'arte.programar.materialfile'

    compileSdk = project.ext.compileSdkVersion
    defaultConfig {
        minSdk = project.ext.minSdkVersion
        targetSdk = project.ext.targetSdkVersion
        versionCode 19
        versionName '3.0.1'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.recyclerview:recyclerview:' + recyclerviewXVersion
    implementation 'com.google.android.material:material:' + materialVersion
    implementation 'androidx.fragment:fragment:' + fragmentXVersion
}
