apply from: gradle.ext.sharedModulesConstants
apply plugin: 'com.android.library'

task sourceJar(type: Jar) {
    from android.sourceSets.main.java.srcDirs
    archiveClassifier = 'sources' // Gradle 8: 'classifier' is gone
}

android {
    namespace 'arte.programar.materialfile'

    compileSdkVersion project.properties.compileSdkVersion
    defaultConfig {
        minSdkVersion project.properties.minSdkVersion
        targetSdkVersion project.properties.targetSdkVersion
        versionCode 19
        versionName '3.0.1'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.recyclerview:recyclerview:' + recyclerviewXVersion
    implementation 'com.google.android.material:material:' + materialVersion
    implementation 'androidx.fragment:fragment:1.1.0' // was wrongly keyed to annotationXVersion (same 1.1.0)
}