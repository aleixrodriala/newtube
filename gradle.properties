android.useAndroidX=true
# NEWTUBE(toolchain): jetifier is OFF - the last com.android.support consumers (the
# espresso androidTest deps + android.support.test runners in SharedModules) were
# migrated to androidx.test in the AGP 8 round.
android.enableJetifier=false
# Minification ram usage fix
org.gradle.jvmargs=-Xmx3000m
# Many modules reference cross-package R fully-qualified; keep the transitive R class.
android.nonTransitiveRClass=false
