apply from: gradle.ext.sharedModulesConstants
apply plugin: 'com.android.library'

android {
    namespace = 'com.r0adkll.slidr'

    compileSdk = project.ext.compileSdkVersion

    defaultConfig {
        minSdk = project.ext.minSdkVersion
        targetSdk = project.ext.targetSdkVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        versionCode 11
        versionName '2.1.0'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.legacy:legacy-support-v4:' + legacySupportV4XVersion
    implementation 'androidx.appcompat:appcompat:' + appCompatXVersion
    implementation 'androidx.recyclerview:recyclerview:' + recyclerviewXVersion
    implementation 'androidx.cardview:cardview:' + cardviewXVersion
    // NEWTUBE(toolchain): com.52inc:52Kit-core:0.6.2 removed - nothing in this module references
    // com.ftinc.kit, and it was the last artifact dragging in com.android.support:*:28.0.0
    // (which broke the build once jetifier was turned off).

    testImplementation 'junit:junit:' + junitVersion
    testImplementation 'org.mockito:mockito-core:' + mockitoVersion
    testImplementation 'org.hamcrest:hamcrest-library:' + hamcrestVersion
}
