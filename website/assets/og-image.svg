<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="NewTube — an unofficial fork of SmartTube for Android phones. Ad-free, open-source.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B0D"/>
      <stop offset="1" stop-color="#0b0c14"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="6%" r="70%">
      <stop offset="0" stop-color="#5C6BC0" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#5C6BC0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="4%" cy="100%" r="60%">
      <stop offset="0" stop-color="#5C6BC0" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#5C6BC0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3D96"/>
      <stop offset="1" stop-color="#1E2A78"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c22"/>
      <stop offset="1" stop-color="#0d0d10"/>
    </linearGradient>
    <clipPath id="scr"><rect x="876" y="150" width="224" height="384" rx="26"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#2a2a31" stroke-width="1"/>

  <!-- Brand -->
  <g transform="translate(84 84)">
    <rect x="0" y="0" width="46" height="46" rx="12" fill="url(#brand)"/>
    <path d="M16.7,39 L16.7,29.5 A9.1,9.1 0 0 1 34.9,29.5 L34.9,39 L29.5,39 L29.5,29.5 A3.73,3.73 0 0 0 22.1,29.5 L22.1,39 Z" fill="#FFFFFF"/>
    <text x="62" y="34" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" letter-spacing="-1">
      <tspan fill="#F5F5F7">New</tspan><tspan fill="#7986CB">Tube</tspan>
    </text>
  </g>

  <!-- Headline (3 lines) -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="82" y="248" font-size="58" font-weight="800" letter-spacing="-2" fill="#F5F5F7">An unofficial</text>
    <text x="82" y="314" font-size="58" font-weight="800" letter-spacing="-2" fill="#F5F5F7">SmartTube fork</text>
    <text x="82" y="380" font-size="58" font-weight="800" letter-spacing="-2" fill="#7986CB">for your phone.</text>
    <text x="84" y="438" font-size="25" font-weight="500" fill="#A0A0A8">Free, open-source, no ads — no root, no tracking.</text>
  </g>

  <!-- Chips -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="700">
    <g transform="translate(84 478)">
      <rect x="0" y="0" width="190" height="46" rx="23" fill="url(#brand)"/>
      <text x="95" y="30" text-anchor="middle" fill="#FFFFFF">Open source (MIT)</text>
    </g>
    <g transform="translate(290 478)">
      <rect x="0" y="0" width="112" height="46" rx="23" fill="#17171A" stroke="#2a2a31"/>
      <text x="56" y="30" text-anchor="middle" fill="#A0A0A8">No ads</text>
    </g>
    <g transform="translate(418 478)">
      <rect x="0" y="0" width="116" height="46" rx="23" fill="#17171A" stroke="#2a2a31"/>
      <text x="58" y="30" text-anchor="middle" fill="#A0A0A8">No root</text>
    </g>
    <g transform="translate(550 478)">
      <rect x="0" y="0" width="176" height="46" rx="23" fill="#17171A" stroke="#2a2a31"/>
      <text x="88" y="30" text-anchor="middle" fill="#A0A0A8">SponsorBlock</text>
    </g>
  </g>

  <!-- Phone glyph -->
  <g>
    <rect x="866" y="140" width="244" height="404" rx="38" fill="#16161b" stroke="#34343d" stroke-width="2"/>
    <rect x="876" y="150" width="224" height="384" rx="26" fill="url(#screen)"/>
    <g clip-path="url(#scr)">
      <!-- topbar -->
      <text x="894" y="188" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#F5F5F7">New<tspan fill="#7986CB">Tube</tspan></text>
      <circle cx="1082" cy="182" r="9" fill="none" stroke="#A0A0A8" stroke-width="2"/>
      <line x1="1088" y1="188" x2="1093" y2="193" stroke="#A0A0A8" stroke-width="2"/>
      <!-- grid -->
      <g>
        <rect x="892" y="206" width="96" height="58" rx="7" fill="#232a3a"/>
        <rect x="996" y="206" width="96" height="58" rx="7" fill="#1f2a3a"/>
        <rect x="892" y="298" width="96" height="58" rx="7" fill="#26332a"/>
        <rect x="996" y="298" width="96" height="58" rx="7" fill="#2b2f42"/>
        <rect x="892" y="390" width="96" height="58" rx="7" fill="#2f2438"/>
        <rect x="996" y="390" width="96" height="58" rx="7" fill="#203233"/>
      </g>
      <g fill="#2a2a31">
        <rect x="892" y="270" width="88" height="8" rx="4"/><rect x="892" y="282" width="56" height="8" rx="4"/>
        <rect x="996" y="270" width="88" height="8" rx="4"/><rect x="996" y="282" width="56" height="8" rx="4"/>
        <rect x="892" y="362" width="88" height="8" rx="4"/><rect x="892" y="374" width="56" height="8" rx="4"/>
        <rect x="996" y="362" width="88" height="8" rx="4"/><rect x="996" y="374" width="56" height="8" rx="4"/>
      </g>
      <!-- bottom nav -->
      <rect x="876" y="494" width="224" height="40" fill="#17171A"/>
      <circle cx="910" cy="514" r="4" fill="#7986CB"/>
      <circle cx="958" cy="514" r="4" fill="#74747d"/>
      <circle cx="1006" cy="514" r="4" fill="#74747d"/>
      <circle cx="1054" cy="514" r="4" fill="#74747d"/>
    </g>
    <rect x="953" y="158" width="70" height="14" rx="7" fill="#050506"/>
  </g>
</svg>
