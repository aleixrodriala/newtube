// NEWTUBE(media3): clone of :doubletapplayerview rebased from the vendored ExoPlayer 2.10.6 onto
// androidx.media3, for the touch (stmobile) flavor's Media3 player. The original module stays
// untouched because the TV PlaybackFragment still uses it; both live in the mobile APK, hence the
// distinct package (com.github.vkay94.dtpv3) and renamed layouts (yt3_*). TV-only
// DoubleTapPlayerAdapter is not carried over.
apply from: gradle.ext.sharedModulesConstants
apply plugin: 'com.android.library'

android {
    namespace = 'com.github.vkay94.dtpv3'

    compileSdk = project.ext.compileSdkVersion

    defaultConfig {
        minSdk = 24 // media3 1.10.x floor is 23; consumed only by the stmobile flavor (also minSdk 24)
        targetSdk = project.ext.targetSdkVersion
        versionCode 40001
        versionName '1.0.4'

        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}

dependencies {
    implementation 'androidx.appcompat:appcompat:' + appCompatXVersion
    implementation 'androidx.core:core-ktx:' + kotlinCoreXVersion
    implementation 'androidx.constraintlayout:constraintlayout:' + constraintLayoutXVersion

    // 1.10.1 needs compileSdk 35+ (we build against 37); keep in sync with
    // the media3 deps in smarttubetv/build.gradle.
    api 'androidx.media3:media3-exoplayer:' + media3Version
    api 'androidx.media3:media3-ui:' + media3Version
}
