// Top-level build file where you can add configuration options common to all sub-projects/modules.
apply from: gradle.ext.sharedModulesConstants

// NOT working
// Running 'gradle wrapper' will generate gradlew
wrapper {
    gradleVersion = gradleVersion
    distributionType = Wrapper.DistributionType.BIN
}

buildscript {
    apply from: gradle.ext.sharedModulesConstants

    repositories {
        google()
        mavenCentral()
        // IntelliJ 'Read timed out' (error 403)
        // https://stackoverflow.com/questions/74258160/is-jcenter-down-permanently-31-oct
        //jcenter()
    }
    dependencies {
        // AGP 9.2 supports API 37 and supplies Kotlin compilation itself. The standalone
        // kotlin-android plugin/classpath is intentionally absent (built-in Kotlin migration).
        classpath 'com.android.tools.build:gradle:9.2.1'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url = uri('https://jitpack.io') }
        //flatDir { dirs 'libs' } // include duktape-my to all subprojects
        // IntelliJ 'Read timed out' (error 403)
        // https://stackoverflow.com/questions/74258160/is-jcenter-down-permanently-31-oct
        //jcenter()
    }
    configurations.all {
        // WorkManager conflict resolution (lint exception: old java runtime)
        // resolutionStrategy.force 'androidx.lifecycle:lifecycle-livedata-core:' + liveDataVersion
        // resolutionStrategy.force 'androidx.lifecycle:lifecycle-livedata:' + liveDataVersion
        // resolutionStrategy.force 'androidx.lifecycle:lifecycle-runtime:' + liveDataVersion
        // Force Android 4 compatible okHttp version
        resolutionStrategy.force 'com.squareup.okhttp3:okhttp:' + okhttpVersion
        // Keep every module on one Kotlin runtime line. kotlin-stdlib-jdk7/jdk8 are empty
        // relocation artifacts that redirect to kotlin-stdlib on modern Kotlin releases.
        resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:' + kotlinVersion
        resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:' + kotlinVersion
        resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:' + kotlinVersion
        resolutionStrategy.force 'org.jetbrains.kotlinx:kotlinx-coroutines-android:' + kotlinxVersion
        // NEWTUBE(toolchain): the androidx.core/core-ktx/annotation downgrade-forces (old-device
        // pins) are gone - media3 1.10.x declares newer versions than the pins and forcing them
        // DOWN would risk runtime NoSuchMethodError inside media3. Plain max-version resolution
        // now applies. The multidex force is gone too (minSdk 24 = native multidex).
        // Downgrade Cronet version for cronet-okhttp
        resolutionStrategy.force 'org.chromium.net:cronet-api:' + cronetApiVersion
        // NEWTUBE(phone-only): the androidx.leanback/androidx.fragment global excludes that
        // shadowed the modded :leanback-1.0.0/:fragment-1.1.0 modules are gone with the TV UI.
        // Stock androidx.fragment 1.1.0 resolves transitively (same version as the mod was).
    }
}
